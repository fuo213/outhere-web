<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booot · Itinerary B: Trip chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../motion.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="itin.css">
<style>
  /* ---- B · Trip chart ------------------------------------------------------ */
  .chart { margin: var(--space-3) var(--space-4) 0; }
  .chart svg { display: block; width: 100%; height: auto; }
  .ch-ann { font: italic var(--weight-regular) var(--text-xs) var(--font-ui); fill: var(--text-body); }
  .ch-note { font: var(--weight-regular) var(--text-xs) var(--font-ui); fill: var(--text-body); }
  .ch-note--teal { fill: var(--type-dayhike-text); font-style: italic; }
  .ch-num { font: var(--weight-regular) var(--text-xs) var(--font-data); fill: var(--text-secondary); }
  .ch-num-mark { font: var(--weight-semi) var(--text-xs) var(--font-ui); fill: var(--text); }
  .ch-label { font: var(--weight-semi) var(--text-xs) var(--font-ui); fill: var(--text-secondary); }
  .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round; }

  .legs { list-style: none; margin: 0; padding: var(--space-3) var(--space-7) var(--space-8); }
  .leg { display: grid; grid-template-columns: 26px 1fr auto; gap: 0 var(--space-3); padding: var(--space-3) 0; border-top: 1px solid var(--border); position: relative; }
  .leg:first-child { border-top: none; }
  .leg-mark { width: 26px; height: 26px; margin-top: -2px; }
  .leg-title { font-size: var(--text-base); font-weight: var(--weight-semi); color: var(--text); margin: 0; }
  .leg-meta { margin-top: 2px; font-size: var(--text-sm); color: var(--text-secondary); }
  .leg-meta .num { font-size: var(--text-sm); }
  .leg-meta .camp { color: var(--type-camp-text); font-weight: var(--weight-semi); }
  .leg-stats { text-align: right; font-family: var(--font-data); font-size: var(--text-sm); color: var(--text-body); line-height: 1.5; }
  .leg-stats .loss { color: var(--text-secondary); }
  .leg-notes { grid-column: 2 / 4; margin: var(--space-2) 0 0; color: var(--text-body); font-size: var(--text-md); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .leg-glyphs { grid-column: 2 / 4; display: flex; align-items: center; gap: var(--space-1); margin-top: var(--space-2); flex-wrap: wrap; }
  .leg-glyphs .stop-glyph { margin: 0; }
  .leg-glyphs .sep { width: 10px; height: 1px; background: var(--border-strong); }
  .leg .edit-row { position: absolute; right: 0; bottom: var(--space-2); }
  .leg.empty-day { display: none; }
  .leg.is-hover .leg-title, .leg:hover .leg-title { text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .leg.is-hover .edit-row, .leg:hover .edit-row { opacity: 1; }
  .leg.is-hover .leg-notes, .leg:hover .leg-notes { -webkit-line-clamp: unset; }
  body[data-state="drag"] .leg:nth-child(4) { background: var(--accent-tint); border-radius: var(--radius-md); }
  body[data-state="empty"] .leg.empty-day { display: grid; }
  @media (max-width: 760px) {
    .leg .edit-row { position: static; grid-column: 2 / 4; margin: var(--space-2) 0 0 calc(-1 * var(--space-3)); }
    .chart { margin: var(--space-2) var(--space-2) 0; }
    .legs { padding: var(--space-2) var(--space-4) var(--space-8); }
  }
</style>
</head>
<body data-state="default">
<div id="bar"></div>
<main class="stage">
  <div class="stage-map" id="map"></div>
  <aside class="panel" aria-label="Trip">
    <div class="panel-scroll">
      <div id="head"></div>
      <figure class="chart" id="chart" style="margin-bottom:0"></figure>
      <div id="tray"></div>
      <ol class="legs" id="legs"></ol>
    </div>
    <div id="foot"></div>
  </aside>
</main>
<script type="module">
import { loadTrip, loadContours, esc, fmt, glyphIcon, wireStates } from "./itin.js";
import { drawChart, dayMark } from "./chart-kit.js";
import { expBar, panelHead, panelFoot, tray, editRow, emptyDayHTML, renderMapStandIn } from "./shared-page.js";

const [m, contours] = await Promise.all([loadTrip(), loadContours()]);
document.getElementById("bar").outerHTML = expBar("chart");
document.getElementById("head").outerHTML = panelHead(m);
document.getElementById("foot").outerHTML = panelFoot();
document.getElementById("tray").outerHTML = tray();

const fig = document.getElementById("chart");
let focus = null;
const paint = () => {
  const W = fig.clientWidth; if (W < 200) return;
  const H = Math.round(W * 0.82);
  fig.innerHTML = drawChart(m, contours, { W, H, focus, id: "ch", aria: `Trip chart: ${m.days.length} days over ${fmt.mi(m.total.miles)}` });
};

function legs(state) {
  let html = "";
  for (const d of m.days) {
    const glyphs = d.stops.filter((s) => s.kind !== "dayhike").map((s) => glyphIcon(s.kind, { size: 20, seed: Math.round(s.mi * 100) }));
    if (d.spur) glyphs.push(glyphIcon("dayhike", { size: 20, seed: 77 }));
    html += `<li class="leg${state === "hover" && d.i === 1 ? " is-hover" : ""}" data-day="${d.i}">
      <svg class="leg-mark" viewBox="0 0 26 26" aria-hidden="true">${dayMark(13, 13, d.n, { r: 10, seed: 400 + d.i })}</svg>
      <div>
        <h3 class="leg-title">${esc(d.title)}</h3>
        <div class="leg-meta">${esc(fmt.date(d.date))}${d.camp ? ` · camp at <span class="camp">${esc(d.camp.name.replace(/^At-large camp /, ""))}</span>` : " · out to the trailhead"}</div>
      </div>
      <div class="leg-stats">${fmt.mi(d.miles)}<br><span>${fmt.gain(d.gain)}</span> <span class="loss">${fmt.loss(d.loss)}</span></div>
      <p class="leg-notes">${esc(d.notes)}</p>
      ${glyphs.length ? `<div class="leg-glyphs" aria-label="Stops">${glyphs.join("")}</div>` : ""}
      ${state === "drag" && d.i === m.days.length - 1 ? `<div class="drop-line" style="grid-column:2/4">Drop into day ${d.n}</div><div style="grid-column:2/4"><span class="pill is-dragging" data-type="camp">Water cache</span></div>` : ""}
      ${editRow()}
    </li>`;
  }
  const e = emptyDayHTML(m);
  html += `<li class="leg empty-day">
      <svg class="leg-mark" viewBox="0 0 26 26" aria-hidden="true">${dayMark(13, 13, e.n, { r: 10, seed: 499, active: false })}</svg>
      <div><h3 class="leg-title" style="color:var(--text-secondary)">Nothing planned yet</h3><div class="leg-meta">${esc(fmt.date(e.date))}</div></div>
      <div></div>
      <p class="empty-hint" style="grid-column:2/4;margin:var(--space-2) 0">Draw a route from the last camp, or drag a stop here.</p>
      <div style="grid-column:2/4"><button class="btn btn--quiet btn--sm">Draw route</button></div>
    </li>`;
  document.getElementById("legs").innerHTML = html;
  document.querySelectorAll(".leg[data-day]").forEach((el) => {
    el.addEventListener("mouseenter", () => { if (document.body.dataset.state !== "hover") { focus = +el.dataset.day; paint(); } });
    el.addEventListener("mouseleave", () => { if (document.body.dataset.state !== "hover") { focus = null; paint(); } });
  });
}

document.addEventListener("statechange", (e) => { focus = e.detail === "hover" ? 1 : null; legs(e.detail); paint(); });
wireStates();
new ResizeObserver(paint).observe(fig);
const mapEl = document.getElementById("map");
new ResizeObserver(() => renderMapStandIn(mapEl, m, contours)).observe(mapEl);
document.body.dataset.ready = "1";
</script>
</body>
</html>
